name: FINN Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Create seen.txt if missing
        run: |
          touch seen.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python Main.py

      - name: Save seen.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen.txt
          git diff --staged --quiet || git commit -m "Update seen list"
          git push
